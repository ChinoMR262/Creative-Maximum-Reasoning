<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="pb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="pb-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="pb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d482"/>
      <stop offset="100%" stop-color="#c29035"/>
    </linearGradient>
    <radialGradient id="pb-radar-sweep" cx="32" cy="32" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base contenedor de autor -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="url(#pb-bg)" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="4" y="4" width="56" height="56" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Anillos concéntricos de medición y radar de red -->
  <circle cx="32" cy="32" r="20" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="14" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="32" cy="32" r="7" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="32" cy="32" r="22" fill="url(#pb-radar-sweep)"/>

  <!-- Ejes de calibración -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#1e293b" stroke-width="1"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#1e293b" stroke-width="1"/>

  <!-- Trazo de pulso / Booster de latencia dinámico -->
  <path d="M16 34L24 34L28 20L34 44L38 28L42 34L48 34" stroke="url(#pb-cyan)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Núcleo de latencia cero / nodo activo de ping -->
  <circle cx="34" cy="44" r="2" fill="#7dd3fc"/>
  <circle cx="28" cy="20" r="2" fill="#38bdf8"/>
  <circle cx="32" cy="32" r="1.5" fill="#f5d482"/>
</svg>
