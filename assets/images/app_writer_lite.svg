<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f26"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </linearGradient>
    <linearGradient id="cw-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d482"/>
      <stop offset="50%" stop-color="#d4a343"/>
      <stop offset="100%" stop-color="#9a6e1a"/>
    </linearGradient>
    <linearGradient id="cw-page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="100%" stop-color="#171920"/>
    </linearGradient>
    <linearGradient id="cw-nib-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#edd07c"/>
      <stop offset="50%" stop-color="#d4a343"/>
      <stop offset="100%" stop-color="#996e1a"/>
    </linearGradient>
  </defs>

  <!-- Base contenedor de autor -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="url(#cw-bg)" stroke="#d4a343" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="4" y="4" width="56" height="56" rx="8" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Páginas de manuscrito editorial -->
  <path d="M15 17C15 15.3431 16.3431 14 18 14H38C39.6569 14 41 15.3431 41 17V46C41 47.6569 39.6569 49 38 49H18C16.3431 49 15 47.6569 15 46V17Z" fill="url(#cw-page)" stroke="#3f4553" stroke-width="1"/>
  
  <!-- Líneas sutiles de texto / capítulos -->
  <line x1="20" y1="20" x2="36" y2="20" stroke="#d4a343" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="26" x2="32" y2="26" stroke="#d4a343" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="28" y2="32" stroke="#d4a343" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="38" x2="30" y2="38" stroke="#d4a343" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pluma estilográfica / Plumín caligráfico de oro artesanal -->
  <g transform="translate(2, 2)">
    <!-- Cuerpo de la pluma -->
    <path d="M47 13L35 25L31 36L42 32L54 20C55.5 18.5 55.5 16 54 14.5L52.5 13C51 11.5 48.5 11.5 47 13Z" fill="#1b1e26" stroke="url(#cw-gold)" stroke-width="1.2"/>
    
    <!-- Plumín de oro puro -->
    <path d="M31 36L25 43C24.5 43.6 23.5 44 22 44.5C22.5 43 22.9 42 23.5 41.5L30.5 34.5L31 36Z" fill="url(#cw-nib-shadow)"/>
    <path d="M35 25L30.5 34.5L31 36L42 32L35 25Z" fill="url(#cw-gold)"/>

    <!-- Corte de tinta del plumín -->
    <line x1="22" y1="44.5" x2="28" y2="38" stroke="#101217" stroke-width="1" stroke-linecap="round"/>
    <circle cx="28.5" cy="37.5" r="0.9" fill="#101217"/>
    
    <!-- Destello de tinta dorada -->
    <circle cx="21" cy="46" r="1.2" fill="#f5d482"/>
  </g>
</svg>
